<script type="application/json" id="atlasData">{"version":1,"language":"zh-CN","title":"一份摘要报告是怎样产生的？","subtitle":"读图顺序：清洗材料 → 查缓存 → 复用或生成 → 返回报告。点击节点查看处理原理、中文逐行注释和提示词来源。","baseline":"示例基线：examples/report_pipeline.py 工作副本（2026-11-24）；已记录源码摘录指纹；没有外部模型调用。","phases":[{"id":"input","label":"清洗材料","nodes":["read"]},{"id":"lookup","label":"验证与查缓存","nodes":["cache","empty"]},{"id":"branch","label":"命中或生成","nodes":["reuse","generate"]},{"id":"finish","label":"返回或报错","nodes":["report","invalid"]}],"nodes":[{"id":"read","title":"清洗材料","kind":"程序","summary":"run() 接收主题、材料和缓存；去掉材料首尾空白。","inputs":["调用方传入 topic、material、cache；文件本身没有 CLI 或顶层 run() 调用。"],"steps":[{"title":"入口是 run()，由外部调用","detail":"run(topic, material, cache) 首先调用 read_material(material)。这三个参数的创建方式不在本示例中。"},{"title":"只清理材料的首尾空白","detail":"text.strip() 得到 cleaned；没有读取文件、网页、切分文档或清洗主题。"},{"title":"分流：空材料报错，其余继续","detail":"cleaned 为空就抛出 ValueError(\"Material is empty\")；不会进入缓存查询。"}],"outputs":["非空 cleaned → 查缓存；空 cleaned → 空材料异常。"],"sourceIds":["entry","clean","context"]},{"id":"cache","title":"按主题和材料查缓存","kind":"程序","summary":"缓存键是 (topic, cleaned)，命中与未命中走两条路径。","inputs":["topic 原值、去掉首尾空白的 cleaned、调用方传入的 cache。"],"steps":[{"title":"构造元组键","detail":"key = (topic, cleaned)。同主题且清洗后的材料相同，才会视为同一条缓存。"},{"title":"判断成员关系","detail":"if key in cache 仅查键是否存在，没有过期时间或版本判断。"},{"title":"两条路径最终都调用 make_report()","detail":"命中读取已有 summary；未命中才拼提示词、获取固定摘要，再把摘要写入 cache。"}],"outputs":["命中 → 复用缓存；未命中 → 本地摘要流程。"],"sourceIds":["entry"]},{"id":"empty","title":"空材料：立即报错","kind":"异常","summary":"抛出 Material is empty；本次调用没有报告。","inputs":["strip() 之后为空的材料，例如仅包含空格或换行。"],"steps":[{"title":"抛出 ValueError","detail":"read_material() 第 11 行直接抛出异常。run() 没有 try/except，因此异常交给调用方。"},{"title":"提前终止后续处理","detail":"不会构造缓存键，不会拼提示词、调用替身或写入缓存，也不会调用 make_report()。"}],"outputs":["ValueError(\"Material is empty\") → 调用方；没有返回值或报告。"],"sourceIds":["clean","entry"]},{"id":"reuse","title":"命中：直接复用摘要","kind":"程序","summary":"读出 cache[key]，跳过提示词、替身、解析与校验。","inputs":["缓存中已有的 cache[key]。"],"steps":[{"title":"取已有值","detail":"summary = cache[key]。这条路径没有验证摘要是否为非空字符串；缓存的质量由调用方负责。"},{"title":"直接返回报告","detail":"return make_report(summary, reused=True) 提前结束 run()；不会执行第 43–45 行的新生成分支。"}],"outputs":["summary 原值与 reused=True → make_report()。"],"sourceIds":["entry","report-source"]},{"id":"generate","title":"未命中：拼接提示词并生成示例摘要","kind":"本地替身","summary":"常量模板 → 两次替换 → 固定 JSON → 解析校验 → 写缓存。","inputs":["topic 原值、cleaned、模块内的 SYSTEM_TEMPLATE 与 USER_TEMPLATE。"],"steps":[{"title":"从仓库常量拼出提示词","detail":"build_prompt() 返回 SYSTEM_TEMPLATE 原文，并依次用 str.replace 替换 USER_TEMPLATE 中的 {{topic}}、{{material}}。没有另一模型编写提示词，也没有片段、条件块或追加规则。"},{"title":"调用本地固定替身","detail":"demonstration_model(system, user) 接收两段文本，但函数体不使用它们的内容；始终用 json.dumps 返回固定英文 summary。它不是实际 LLM 请求，也不根据材料生成新摘要。"},{"title":"把字符串解析为对象并校验","detail":"json.loads(reply) 得到字典。随后要求 summary 为字符串且 strip() 后非空；失败会抛出 Invalid summary。固定替身正常返回时满足校验，防御分支不会触发。"},{"title":"通过后写入缓存","detail":"返回 result[\"summary\"] 原值，run() 再执行 cache[key] = summary，最后带 reused=False 组装报告。校验只检查非空，不会去掉摘要首尾空白。"}],"outputs":["有效 summary 写入 cache[key]，与 reused=False → 报告；校验失败 → 异常。"],"sourceIds":["templates","prompt-build","stand-in","generation","entry"],"promptIds":["summary-prompt"]},{"id":"report","title":"组装并返回报告字典","kind":"程序","summary":"共享终点：summary、reused、format；没有落盘或导出。","inputs":["命中：已有 summary 与 reused=True；未命中且校验通过：新 summary 与 reused=False。"],"steps":[{"title":"组装三个字段","detail":"make_report() 返回 Python 字典 {\"summary\": summary, \"reused\": reused, \"format\": \"json-report\"}。format 只是固定标签。"},{"title":"返回给调用方","detail":"run() 返回该字典。这里没有把报告序列化成 JSON 文件，没有 TTS、HTML 渲染或视频导出。"},{"title":"区别状态副作用","detail":"未命中分支在返回前把摘要写入调用方的 cache；命中分支读取已有值并提前返回。"}],"outputs":["报告 Python dict → 调用方；未命中时 cache 还多出一条摘要。"],"sourceIds":["report-source","entry"]},{"id":"invalid","title":"摘要无效：防御报错","kind":"异常","summary":"固定替身正常不会走到这里；失败时不写缓存或返回报告。","inputs":["json.loads 得到的对象中，summary 不是字符串或仅含空白。"],"steps":[{"title":"按条件抛出异常","detail":"not isinstance(resul
