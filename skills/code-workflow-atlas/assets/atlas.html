idence',L('核对依据与范围','Evidence and scope')]].forEach(([key,label])=>{if(!n.comparison[key])return;const box=el('div','compare-item');box.append(el('b','',label),el('p','',n.comparison[key]));root.append(box)});n.sourceIds?.forEach(id=>source(root,id))}root.scrollTop=0}
const NS='http://www.w3.org/2000/svg';function sv(tag,attrs={},text){const x=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>x.setAttribute(k,String(v)));if(text!==undefined)x.textContent=text;return x}function textBlock(parent,x,y,text,maxChars,cls,maxLines=2){const chars=Array.from(text||'');let lines=[],line='',units=0;for(const ch of chars){const width=/[^\u0000-\u00ff]/.test(ch)?2:1;if(units+width>maxChars){lines.push(line);line='';units=0}line+=ch;units+=width}if(line)lines.push(line);if(lines.length>maxLines)lines=lines.slice(0,maxLines).map((x,i)=>i===maxLines-1?x.slice(0,-1)+'…':x);const textEl=sv('text',{x,y,class:cls});lines.forEach((line,i)=>textEl.append(sv('tspan',{x,dy:i?22:0},line)));parent.append(textEl)}
function drawMap(){const compare=state.compare&&DATA.comparison,width=compare?1780:1000,height=DATA.phases.length*180+100,positions=new Map();const svg=sv('svg',{viewBox:`0 0 ${width} ${height}`,role:'img','aria-label':DATA.title,preserveAspectRatio:'xMidYMin meet'});svg.append(sv('title',{},DATA.title));const defs=sv('defs'),marker=sv('marker',{id:'arrow',viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:6,markerHeight:6,orient:'auto'});marker.append(sv('path',{d:'M0 0 L10 5 L0 10Z',fill:'#9bb7a9'}));defs.append(marker);svg.append(defs);if(compare){svg.append(sv('text',{x:40,y:29,class:'col-label'},L('当前工作流','Primary workflow')),sv('text',{x:1020,y:29,class:'col-label'},DATA.comparison.title||'Reference'))}DATA.phases.forEach((phase,i)=>{[['nodes',0,1000],['compare',1000,780]].forEach(([lane,offset,laneWidth])=>{if(lane==='compare'&&!compare)return;const ids=phase[lane]||[],w=(laneWidth-90-Math.max(0,ids.length-1)*25)/Math.max(1,ids.length);ids.forEach((id,j)=>positions.set(id,{x:offset+45+j*(w+25),y:65+i*180,w,h:120,reference:lane==='compare',index:i}))})});
